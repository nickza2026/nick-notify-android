name: Validate Notify Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-ci.yaml"
      - "dashboard/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/web-ci.yaml"
      - "dashboard/**"

permissions:
  contents: read

concurrency:
  group: notify-web-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # LayoutProps/PageProps and next-env.d.ts are generated into .next (gitignored).
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dockerize:
    name: Build & Smoke Test Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          cache-from: type=gha,scope=backoffice
          cache-to: type=gha,mode=max,scope=backoffice
          pull: true
          push: false
          load: true
          context: ./dashboard
          file: ./dashboard/Dockerfile
          tags: notify-backoffice:${{ github.sha }}
      - name: Smoke test non-root container and localhost guard
        env:
          IMAGE: notify-backoffice:${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "node"
          docker run -d --name backoffice-smoke -p 127.0.0.1:3010:3010 "$IMAGE"
          trap 'docker logs backoffice-smoke; docker rm -f backoffice-smoke' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010/ -o /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          for path in /api/history /api/stats /api/alerts/bad.id; do
            status=$(curl --silent --show-error -o /tmp/backoffice-local.json -w '%{http_code}' \
              "http://127.0.0.1:3010$path")
            test "$status" = 400
          done
          status=$(curl --silent --show-error -o /tmp/backoffice-denied.json -w '%{http_code}' \
            -H 'Host: backoffice.example.invalid' http://127.0.0.1:3010/api/history)
          test "$status" = 403
      - name: Export image for download (no registry push)
        env:
          IMAGE: notify-backoffice:${{ github.sha }}
        run: docker save "$IMAGE" -o "$RUNNER_TEMP/backoffice-image.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: backoffice-image-${{ github.sha }}
          path: ${{ runner.temp }}/backoffice-image.tar
          retention-days: 3
          compression-level: 0
