# Build-only until the Notify API's registry and Nortezh target are approved.
# The Nortezh reusable workflow has no active caller; its callers are .example files.
name: Validate Notify Go API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-ci.yaml"
      - ".github/workflows/deliver-notify-api-nortezh.yml"
      - "backend/**"
      - "Dockerfile.go"
      - "Dockerfile.go.dockerignore"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/api-ci.yaml"
      - ".github/workflows/deliver-notify-api-nortezh.yml"
      - "backend/**"
      - "Dockerfile.go"
      - "Dockerfile.go.dockerignore"

permissions:
  contents: read

concurrency:
  group: notify-go-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Cache embedded postgres binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/notify-alarm/embedded-postgres
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout=8m

  dockerize:
    name: Build Image (no publish)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          pull: true
          push: false
          context: .
          file: ./Dockerfile.go
