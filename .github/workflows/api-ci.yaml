# PR/manual: build only. Main push: deliver the tested image after runtime gates.
name: Build and Deliver Notify Go API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-ci.yaml"
      - ".github/workflows/deliver-notify-api-nortezh.yml"
      - "backend/**"
      - "Dockerfile.go"
      - "Dockerfile.go.dockerignore"
      - "tools/test-delivery-workflows.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/api-ci.yaml"
      - ".github/workflows/deliver-notify-api-nortezh.yml"
      - "backend/**"
      - "Dockerfile.go"
      - "Dockerfile.go.dockerignore"
      - "tools/test-delivery-workflows.mjs"

permissions:
  contents: read

concurrency:
  group: notify-go-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test delivery workflow safety
        working-directory: .
        run: node --test tools/test-delivery-workflows.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Cache embedded postgres binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/notify-alarm/embedded-postgres
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout=8m

  dockerize:
    name: Build Image (no publish)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          context: .
          file: ./Dockerfile.go
          tags: notify-api:${{ github.sha }}
      - name: Export tested API image
        env:
          IMAGE: notify-api:${{ github.sha }}
        run: docker save "$IMAGE" -o "$RUNNER_TEMP/api-image.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: notify-api-image-${{ github.sha }}
          path: ${{ runner.temp }}/api-image.tar
          overwrite: true
          retention-days: 3
          compression-level: 0

  deliver:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dockerize
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deliver-notify-api-nortezh.yml
    with:
      app: api
