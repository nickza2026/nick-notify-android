# Reusable only: no push, dispatch or release caller is active in this repository.
# Approve the target/runtime configuration before activating the example callers.
name: Deliver Notify Go API to Nortezh

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nortezh-notify-api-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Verify an annotated or lightweight production release tag.
          persist-credentials: false
      - name: Validate production build context
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/cmd/notify-api/main.go
          test -f backend/migrations/001_init.sql
          test -f Dockerfile.go
          test -f Dockerfile.go.dockerignore
      - name: Bind production source to published release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          [[ "$GITHUB_EVENT_NAME" == release ]]
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Cache embedded PostgreSQL test binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/notify-alarm/embedded-postgres
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: Build, vet and test with isolated embedded PostgreSQL
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go build ./...
          go vet ./...
          go test ./... -count=1 -timeout=8m

  approve-target:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: notify-api-production
    steps:
      - name: Require approved existing WebService and configured runtime
        shell: bash
        env:
          NTZ_PROJECT: ${{ vars.NTZ_PROJECT }}
          NTZ_LOCATION: ${{ vars.NTZ_LOCATION }}
          NTZ_DEPLOYMENT: ${{ vars.NTZ_DEPLOYMENT }}
          NTZ_TYPE: ${{ vars.NTZ_TYPE }}
          NTZ_PORT: ${{ vars.NTZ_PORT }}
          NTZ_EXISTING_TARGET_CONFIRMED: ${{ vars.NTZ_EXISTING_TARGET_CONFIRMED }}
          NTZ_RUNTIME_READY: ${{ vars.NTZ_RUNTIME_READY }}
          NTZ_SA_EMAIL: ${{ secrets.NTZ_SA_EMAIL }}
          NTZ_SA_KEY: ${{ secrets.NTZ_SA_KEY }}
        run: |
          set -euo pipefail
          test -n "$NTZ_PROJECT"
          test -n "$NTZ_LOCATION"
          test -n "$NTZ_DEPLOYMENT"
          [[ "$NTZ_PROJECT" == internal-tools ]]
          [[ "$NTZ_LOCATION" == olufy-0 ]]
          [[ "$NTZ_DEPLOYMENT" == notify-alarm-api ]]
          test -n "$NTZ_SA_EMAIL"
          test -n "$NTZ_SA_KEY"
          [[ "$NTZ_TYPE" == WebService ]]
          [[ "$NTZ_PORT" == 8787 ]]
          [[ "$NTZ_EXISTING_TARGET_CONFIRMED" == true ]]
          [[ "$NTZ_RUNTIME_READY" == true ]]
          echo 'Approved target configuration present; this does not verify runtime health.'

  publish:
    needs: approve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select commit- and run-specific image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/notify-api"
          printf 'tag=%s:%s-%s-%s\n' "$image" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build and publish the verified revision
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.go
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=notify-api-production-amd64
          cache-to: type=gha,mode=max,scope=notify-api-production-amd64
      - name: Record published image identity
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          printf 'Published %s\nDigest %s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    environment: notify-api-production
    steps:
      - name: Recheck exact approved WebService destination
        shell: bash
        env:
          NTZ_PROJECT: ${{ vars.NTZ_PROJECT }}
          NTZ_LOCATION: ${{ vars.NTZ_LOCATION }}
          NTZ_DEPLOYMENT: ${{ vars.NTZ_DEPLOYMENT }}
          NTZ_TYPE: ${{ vars.NTZ_TYPE }}
          NTZ_PORT: ${{ vars.NTZ_PORT }}
          NTZ_EXISTING_TARGET_CONFIRMED: ${{ vars.NTZ_EXISTING_TARGET_CONFIRMED }}
          NTZ_RUNTIME_READY: ${{ vars.NTZ_RUNTIME_READY }}
        run: |
          set -euo pipefail
          test -n "$NTZ_PROJECT"
          test -n "$NTZ_LOCATION"
          test -n "$NTZ_DEPLOYMENT"
          [[ "$NTZ_PROJECT" == internal-tools ]]
          [[ "$NTZ_LOCATION" == olufy-0 ]]
          [[ "$NTZ_DEPLOYMENT" == notify-alarm-api ]]
          [[ "$NTZ_TYPE" == WebService ]]
          [[ "$NTZ_PORT" == 8787 ]]
          [[ "$NTZ_EXISTING_TARGET_CONFIRMED" == true ]]
          [[ "$NTZ_RUNTIME_READY" == true ]]
      - name: Create revision of the approved target
        uses: Nortezh/nortezh-action@ec5808f79fa5cfc74514e8631a0013315a79475f # v1.0.5
        with:
          action: deployment.create-revision
          project: ${{ vars.NTZ_PROJECT }}
          location: ${{ vars.NTZ_LOCATION }}
          name: ${{ vars.NTZ_DEPLOYMENT }}
          image: ${{ needs.publish.outputs.image }}
          type: WebService
          port: ${{ vars.NTZ_PORT }}
        env:
          SA_AUTH_EMAIL: ${{ secrets.NTZ_SA_EMAIL }}
          SA_AUTH_KEY: ${{ secrets.NTZ_SA_KEY }}
