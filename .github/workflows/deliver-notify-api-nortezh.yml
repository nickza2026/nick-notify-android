# Called only after the API/Web CI has built and exported this run's tested image.
name: Deliver Notify API or Web to Nortezh

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nortezh-notify-${{ inputs.app }}-production
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      environment: ${{ steps.select.outputs.environment }}
      target: ${{ steps.select.outputs.target }}
      port: ${{ steps.select.outputs.port }}
      artifact: ${{ steps.select.outputs.artifact }}
      archive: ${{ steps.select.outputs.archive }}
      local_image: ${{ steps.select.outputs.local_image }}
      image: ${{ steps.select.outputs.image }}
    steps:
      - name: Bind delivery to a tested main push and known application
        id: select
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          case "$APP" in
            api)
              target=notify-alarm-api
              port=8787
              artifact="notify-api-image-$GITHUB_SHA"
              archive=api-image.tar
              local_image="notify-api:$GITHUB_SHA"
              ;;
            web)
              target=notify-alarm-web
              port=3010
              artifact="backoffice-image-$GITHUB_SHA"
              archive=backoffice-image.tar
              local_image="notify-backoffice:$GITHUB_SHA"
              ;;
            *) exit 1 ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}/notify-$APP:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'environment=notify-%s-production\ntarget=%s\nport=%s\nartifact=%s\narchive=%s\nlocal_image=%s\nimage=%s\n' \
            "$APP" "$target" "$port" "$artifact" "$archive" "$local_image" "$image" >> "$GITHUB_OUTPUT"

  approve-target:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: ${{ needs.source.outputs.environment }}
    steps:
      - name: Require prepared target and operator-approved runtime before publication
        shell: bash
        env:
          APP: ${{ inputs.app }}
          EXPECTED_TARGET: ${{ needs.source.outputs.target }}
          EXPECTED_PORT: ${{ needs.source.outputs.port }}
          NTZ_PROJECT: ${{ vars.NTZ_PROJECT }}
          NTZ_LOCATION: ${{ vars.NTZ_LOCATION }}
          NTZ_DEPLOYMENT: ${{ vars.NTZ_DEPLOYMENT }}
          NTZ_TYPE: ${{ vars.NTZ_TYPE }}
          NTZ_PORT: ${{ vars.NTZ_PORT }}
          NTZ_EXISTING_TARGET_CONFIRMED: ${{ vars.NTZ_EXISTING_TARGET_CONFIRMED }}
          NTZ_RUNTIME_READY: ${{ vars.NTZ_RUNTIME_READY }}
          NTZ_WEB_ACCESS_PROTECTED: ${{ vars.NTZ_WEB_ACCESS_PROTECTED }}
          NTZ_SA_EMAIL: ${{ secrets.NTZ_SA_EMAIL }}
          NTZ_SA_KEY: ${{ secrets.NTZ_SA_KEY }}
        run: |
          set -euo pipefail
          [[ "$NTZ_PROJECT" == internal-tools ]]
          [[ "$NTZ_LOCATION" == olufy-0 ]]
          [[ "$NTZ_DEPLOYMENT" == "$EXPECTED_TARGET" ]]
          [[ "$NTZ_TYPE" == WebService ]]
          [[ "$NTZ_PORT" == "$EXPECTED_PORT" ]]
          [[ "$NTZ_EXISTING_TARGET_CONFIRMED" == true ]]
          [[ "$NTZ_RUNTIME_READY" == true ]]
          test -n "$NTZ_SA_EMAIL"
          test -n "$NTZ_SA_KEY"
          if [[ "$APP" == web ]]; then
            [[ "$NTZ_WEB_ACCESS_PROTECTED" == true ]]
          fi
          echo 'Target attestations present; operator verification is still required for runtime health.'

  publish:
    needs: [source, approve-target]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ needs.source.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download only this workflow run's tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: ${{ runner.temp }}/tested-image
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image without rebuilding
        id: push
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/tested-image
          ARCHIVE: ${{ needs.source.outputs.archive }}
          LOCAL_IMAGE: ${{ needs.source.outputs.local_image }}
          IMAGE: ${{ needs.source.outputs.image }}
        run: |
          set -euo pipefail
          test -s "$ARTIFACT_DIR/$ARCHIVE"
          docker load --input "$ARTIFACT_DIR/$ARCHIVE"
          tested_id=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')
          docker tag "$LOCAL_IMAGE" "$IMAGE"
          [[ "$(docker image inspect "$IMAGE" --format '{{.Id}}')" == "$tested_id" ]]
          docker push "$IMAGE" | tee "$RUNNER_TEMP/notify-push.log"
          digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' "$RUNNER_TEMP/notify-push.log" | tail -n 1)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published tested image %s\nDigest %s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [source, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    environment: ${{ needs.source.outputs.environment }}
    steps:
      - name: Recheck destination and access protection before creating revision
        shell: bash
        env:
          APP: ${{ inputs.app }}
          EXPECTED_TARGET: ${{ needs.source.outputs.target }}
          EXPECTED_PORT: ${{ needs.source.outputs.port }}
          NTZ_PROJECT: ${{ vars.NTZ_PROJECT }}
          NTZ_LOCATION: ${{ vars.NTZ_LOCATION }}
          NTZ_DEPLOYMENT: ${{ vars.NTZ_DEPLOYMENT }}
          NTZ_TYPE: ${{ vars.NTZ_TYPE }}
          NTZ_PORT: ${{ vars.NTZ_PORT }}
          NTZ_EXISTING_TARGET_CONFIRMED: ${{ vars.NTZ_EXISTING_TARGET_CONFIRMED }}
          NTZ_RUNTIME_READY: ${{ vars.NTZ_RUNTIME_READY }}
          NTZ_WEB_ACCESS_PROTECTED: ${{ vars.NTZ_WEB_ACCESS_PROTECTED }}
        run: |
          set -euo pipefail
          [[ "$NTZ_PROJECT" == internal-tools ]]
          [[ "$NTZ_LOCATION" == olufy-0 ]]
          [[ "$NTZ_DEPLOYMENT" == "$EXPECTED_TARGET" ]]
          [[ "$NTZ_TYPE" == WebService ]]
          [[ "$NTZ_PORT" == "$EXPECTED_PORT" ]]
          [[ "$NTZ_EXISTING_TARGET_CONFIRMED" == true ]]
          [[ "$NTZ_RUNTIME_READY" == true ]]
          if [[ "$APP" == web ]]; then
            [[ "$NTZ_WEB_ACCESS_PROTECTED" == true ]]
          fi
      - name: Create revision with the exact published image tag
        uses: Nortezh/nortezh-action@ec5808f79fa5cfc74514e8631a0013315a79475f # v1.0.5
        with:
          action: deployment.create-revision
          project: ${{ vars.NTZ_PROJECT }}
          location: ${{ vars.NTZ_LOCATION }}
          name: ${{ vars.NTZ_DEPLOYMENT }}
          image: ${{ needs.publish.outputs.image }}
          type: WebService
          port: ${{ vars.NTZ_PORT }}
        env:
          SA_AUTH_EMAIL: ${{ secrets.NTZ_SA_EMAIL }}
          SA_AUTH_KEY: ${{ secrets.NTZ_SA_KEY }}
